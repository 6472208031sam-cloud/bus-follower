<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ntfy Alert Test</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 16px; }
  button { font-size: 1.1rem; padding: 12px 20px; background: #0b6e4f; color: #fff;
           border: none; border-radius: 8px; cursor: pointer; margin: 6px 4px; }
  button:disabled { background: #999; }
  button.small { font-size: 0.9rem; padding: 8px 12px; margin: 3px; text-align: left; display: block; width: 100%; box-sizing: border-box; background: #14532d; }
  button.small:disabled { background: #999; }
  h2 { margin-top: 28px; border-bottom: 2px solid #0b6e4f; padding-bottom: 6px; }
  #log { margin-top: 20px; font-size: 0.9rem; }
  #log div { padding: 6px 0; border-bottom: 1px solid #eee; }
  .ok { color: #0b6e4f; } .err { color: #c00; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; }
</style>
</head>
<body>
<h1>ntfy Alert Test</h1>
<p>Sends <strong>TEST</strong> alerts to the channel saved in the Bus Follower page.</p>
<p>Channel: <code id="topicDisplay" style="word-break:break-all;"></code></p>
<script>document.getElementById("topicDisplay").textContent = TOPIC;</script>

<h2>Bulk send</h2>
<div class="row">
  <button id="allBtn" onclick="runAll()">Send All (AM + PM)</button>
  <button id="amBtn" onclick="runAM()">Send All AM</button>
  <button id="pmBtn" onclick="runPM()">Send All PM</button>
</div>

<h2>Individual stops — AM</h2>
<div id="amList"></div>

<h2>Individual stops — PM</h2>
<div id="pmList"></div>

<h2>Log</h2>
<div id="log"></div>

<script>
var TOPIC = localStorage.getItem('busfollower_topic') || 'bus-alerts-zpxz5jrwzkl4pwoo-01';
var AM_STOPS = [[1, "ON WILLIAM CUTMORE AVE AT EVEREST CRES (NORTH ENTRANCE) AT PARK"], [2, "ON FORD STRATHY CRES - OPPOSITE 1411 AT BENCHES"], [3, "ON MEADOWRIDGE DR AT WHEAT BOOM DR (N/W CORNER)"], [4, "ON JOHN MCKAY BLVD - NORTH OF ANSON GATE AT WALKWAY"], [5, "ON THRESHING MILL BLVD AT MEADOW MARSH CRES (N/E CORNER)"], [6, "ON WHEAT BOOM DR - OPPOSITE 434 WHEAT BOOM DR AT PARK"], [7, "ON POSTRIDGE DR AT FAIRGATE WAY (N/W CORNER) - TRANSIT STYLE STOP"], [8, "ON CRIMSON OAK TRAIL - BETWEEN NICHOLS & CEDAR"], [9, "ON PONDVIEW PL - OPPOSITE 495 PONDVIEW PL AT PARK SIGN"], [10, "ON CORONATION DR AT NORTH RIDGE TRAIL (S/E CORNER) AT PARK"], [11, "ON CRAIGLEITH RD - OPPOSITE SYLVIA DR AT PARK (SOUTH SIDE)"], [12, "ON CRAIGLEITH RD AT MEADOWRIDGE DR (S/W CORNER)"], [13, "SCHOOL: ST MARGUERITE D'YOUVILLE CES - 1359 BAYSHIRE DR - BUS LOADING ZONE"]];
var PM_STOPS = [["S", 13, "SCHOOL: ST MARGUERITE D'YOUVILLE CES - 1359 BAYSHIRE DR - BUS LOADING ZONE"], ["A", 9, "ON PONDVIEW PL - OPPOSITE 495 PONDVIEW PL AT PARK SIGN"], ["B", 8, "ON CRIMSON OAK TRAIL - BETWEEN NICHOLS & CEDAR"], ["C", 10, "ON CORONATION DR AT NORTH RIDGE TRAIL (S/E CORNER) AT PARK"], ["D", 11, "ON CRAIGLEITH RD - OPPOSITE SYLVIA DR AT PARK (SOUTH SIDE)"], ["E", 12, "ON CRAIGLEITH RD AT MEADOWRIDGE DR (S/W CORNER)"], ["F", 1, "ON WILLIAM CUTMORE AVE AT EVEREST CRES (NORTH ENTRANCE) AT PARK"], ["G", 2, "ON FORD STRATHY CRES - OPPOSITE 1411 AT BENCHES"], ["H", 3, "ON MEADOWRIDGE DR AT WHEAT BOOM DR (N/W CORNER)"], ["I", 4, "ON JOHN MCKAY BLVD - NORTH OF ANSON GATE AT WALKWAY"], ["J", 5, "ON THRESHING MILL BLVD AT MEADOW MARSH CRES (N/E CORNER)"], ["K", 6, "ON WHEAT BOOM DR - OPPOSITE 434 WHEAT BOOM DR AT PARK"], ["L", 7, "ON POSTRIDGE DR AT FAIRGATE WAY (N/W CORNER) - TRANSIT STYLE STOP"]];

function log(msg, cls) {
  var d = document.createElement('div');
  d.className = cls || '';
  d.textContent = msg;
  document.getElementById('log').appendChild(d);
  d.scrollIntoView({ block: 'nearest' });
}

function send(msg) {
  return fetch('https://ntfy.sh/' + TOPIC, { method: 'POST', body: msg })
    .then(function (r) { return r.ok; })
    .catch(function () { return false; });
}

function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

function setBusy(busy) {
  var btns = document.querySelectorAll('button');
  btns.forEach(function (b) { b.disabled = busy; });
}

function amMsg(s) {
  return '🔔 TEST: 🚌 Stop ' + s[0] + ': ' + s[1] + ' reached.';
}
function pmMsg(p) {
  return '🔔 TEST: 🚌 Stop ' + p[0] + ' (' + p[1] + '): ' + p[2] + ' reached.';
}

async function sendOne(label, msg) {
  var ok = await send(msg);
  log((ok ? '✓ ' : '✗ ') + label, ok ? 'ok' : 'err');
  return ok;
}

async function runAM() {
  setBusy(true);
  log('--- AM stops ---');
  for (var i = 0; i < AM_STOPS.length; i++) {
    var s = AM_STOPS[i];
    await sendOne('AM Stop ' + s[0], amMsg(s));
    await sleep(1000);
  }
  log('AM done.');
  setBusy(false);
}

async function runPM() {
  setBusy(true);
  log('--- PM stops ---');
  for (var j = 0; j < PM_STOPS.length; j++) {
    var p = PM_STOPS[j];
    await sendOne('PM Stop ' + p[0] + ' (' + p[1] + ')', pmMsg(p));
    await sleep(1000);
  }
  log('PM done.');
  setBusy(false);
}

async function runAll() {
  setBusy(true);
  log('--- AM stops ---');
  for (var i = 0; i < AM_STOPS.length; i++) {
    var s = AM_STOPS[i];
    await sendOne('AM Stop ' + s[0], amMsg(s));
    await sleep(1000);
  }
  log('--- PM stops ---');
  for (var j = 0; j < PM_STOPS.length; j++) {
    var p = PM_STOPS[j];
    await sendOne('PM Stop ' + p[0] + ' (' + p[1] + ')', pmMsg(p));
    await sleep(1000);
  }
  log('All done.');
  setBusy(false);
}

// Build individual stop buttons
(function buildLists() {
  var amList = document.getElementById('amList');
  AM_STOPS.forEach(function (s) {
    var b = document.createElement('button');
    b.className = 'small';
    b.textContent = 'Stop ' + s[0] + ' — ' + s[1].substring(0, 45) + (s[1].length > 45 ? '…' : '');
    b.onclick = function () {
      b.disabled = true;
      sendOne('AM Stop ' + s[0], amMsg(s)).then(function () { b.disabled = false; });
    };
    amList.appendChild(b);
  });
  var pmList = document.getElementById('pmList');
  PM_STOPS.forEach(function (p) {
    var b = document.createElement('button');
    b.className = 'small';
    b.textContent = 'Stop ' + p[0] + ' (' + p[1] + ') — ' + p[2].substring(0, 40) + (p[2].length > 40 ? '…' : '');
    b.onclick = function () {
      b.disabled = true;
      sendOne('PM Stop ' + p[0] + ' (' + p[1] + ')', pmMsg(p)).then(function () { b.disabled = false; });
    };
    pmList.appendChild(b);
  });
})();
</script>
</body>
</html>
