<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ntfy Alert Test</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 16px; }
  button { font-size: 1.2rem; padding: 14px 28px; background: #0b6e4f; color: #fff;
           border: none; border-radius: 8px; cursor: pointer; margin: 10px 5px; }
  button:disabled { background: #999; }
  #log { margin-top: 20px; font-size: 0.9rem; }
  #log div { padding: 6px 0; border-bottom: 1px solid #eee; }
  .ok { color: #0b6e4f; } .err { color: #c00; }
</style>
</head>
<body>
<h1>ntfy Alert Test</h1>
<p>Sends <strong>TEST</strong> alerts for all 13 AM stops, then all 13 PM stops, to the channel saved in the Bus Follower page.</p>
<button id="startBtn" onclick="runTest()">Send All Test Alerts</button>
<div id="log"></div>
<script>
var TOPIC = localStorage.getItem('busfollower_topic') || 'bus-alerts-zpxz5jrwzkl4pwoo';
var AM_STOPS = [[1, "ON WILLIAM CUTMORE AVE AT EVEREST CRES (NORTH ENTRANCE) AT PARK"], [2, "ON FORD STRATHY CRES - OPPOSITE 1411 AT BENCHES"], [3, "ON MEADOWRIDGE DR AT WHEAT BOOM DR (N/W CORNER)"], [4, "ON JOHN MCKAY BLVD - NORTH OF ANSON GATE AT WALKWAY"], [5, "ON THRESHING MILL BLVD AT MEADOW MARSH CRES (N/E CORNER)"], [6, "ON WHEAT BOOM DR - OPPOSITE 434 WHEAT BOOM DR AT PARK"], [7, "ON POSTRIDGE DR AT FAIRGATE WAY (N/W CORNER) - TRANSIT STYLE STOP"], [8, "ON CRIMSON OAK TRAIL - BETWEEN NICHOLS & CEDAR"], [9, "ON PONDVIEW PL - OPPOSITE 495 PONDVIEW PL AT PARK SIGN"], [10, "ON CORONATION DR AT NORTH RIDGE TRAIL (S/E CORNER) AT PARK"], [11, "ON CRAIGLEITH RD - OPPOSITE SYLVIA DR AT PARK (SOUTH SIDE)"], [12, "ON CRAIGLEITH RD AT MEADOWRIDGE DR (S/W CORNER)"], [13, "SCHOOL: ST MARGUERITE D'YOUVILLE CES - 1359 BAYSHIRE DR - BUS LOADING ZONE"]];
var PM_STOPS = [["S", 13, "SCHOOL: ST MARGUERITE D'YOUVILLE CES - 1359 BAYSHIRE DR - BUS LOADING ZONE"], ["A", 9, "ON PONDVIEW PL - OPPOSITE 495 PONDVIEW PL AT PARK SIGN"], ["B", 8, "ON CRIMSON OAK TRAIL - BETWEEN NICHOLS & CEDAR"], ["C", 10, "ON CORONATION DR AT NORTH RIDGE TRAIL (S/E CORNER) AT PARK"], ["D", 11, "ON CRAIGLEITH RD - OPPOSITE SYLVIA DR AT PARK (SOUTH SIDE)"], ["E", 12, "ON CRAIGLEITH RD AT MEADOWRIDGE DR (S/W CORNER)"], ["F", 1, "ON WILLIAM CUTMORE AVE AT EVEREST CRES (NORTH ENTRANCE) AT PARK"], ["G", 2, "ON FORD STRATHY CRES - OPPOSITE 1411 AT BENCHES"], ["H", 3, "ON MEADOWRIDGE DR AT WHEAT BOOM DR (N/W CORNER)"], ["I", 4, "ON JOHN MCKAY BLVD - NORTH OF ANSON GATE AT WALKWAY"], ["J", 5, "ON THRESHING MILL BLVD AT MEADOW MARSH CRES (N/E CORNER)"], ["K", 6, "ON WHEAT BOOM DR - OPPOSITE 434 WHEAT BOOM DR AT PARK"], ["L", 7, "ON POSTRIDGE DR AT FAIRGATE WAY (N/W CORNER) - TRANSIT STYLE STOP"]];

function log(msg, cls) {
  var d = document.createElement('div');
  d.className = cls || '';
  d.textContent = msg;
  document.getElementById('log').appendChild(d);
}

function send(msg) {
  return fetch('https://ntfy.sh/' + TOPIC, { method: 'POST', body: msg })
    .then(function (r) { return r.ok; })
    .catch(function () { return false; });
}

function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

async function runTest() {
  var btn = document.getElementById('startBtn');
  btn.disabled = true;
  document.getElementById('log').innerHTML = '';

  log('--- AM stops ---');
  for (var i = 0; i < AM_STOPS.length; i++) {
    var s = AM_STOPS[i];
    var msg = '\uD83D\uDD14 TEST: \uD83D\uDE8C Stop ' + s[0] + ': ' + s[1] + ' reached.';
    var ok = await send(msg);
    log((ok ? '✓ ' : '✗ ') + 'AM Stop ' + s[0], ok ? 'ok' : 'err');
    await sleep(1200);
  }

  log('--- PM stops ---');
  for (var j = 0; j < PM_STOPS.length; j++) {
    var p = PM_STOPS[j];
    var pmsg = '\uD83D\uDD14 TEST: \uD83D\uDE8C Stop ' + p[0] + ' (' + p[1] + '): ' + p[2] + ' reached.';
    var pok = await send(pmsg);
    log((pok ? '✓ ' : '✗ ') + 'PM Stop ' + p[0] + ' (' + p[1] + ')', pok ? 'ok' : 'err');
    await sleep(1200);
  }

  log('Done!');
  btn.disabled = false;
}
</script>
</body>
</html>
